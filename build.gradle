plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.19.1",
            "org.junit.jupiter:junit-jupiter:5.11.4",
            "org.slf4j:slf4j-simple:2.0.13",
            'net.datafaker:datafaker:2.7.0'
    )
    testImplementation 'io.qameta.allure:allure-selenide:3.1.1'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

allure {
    version = '2.32.0'
    adapter {
        aspectjWeaver.set(true)
        allureJavaVersion.set('3.1.1')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'selenide.timeout', '10000'

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "full"
        }
    }
}