plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

def selenideVersion = "7.19.1"
def allureVersion = "2.32.0"
def allureAdapterVersion = "3.1.1"
def junitVersion = "5.11.4"
def slf4jVersion = "2.0.13"
def datafakerVersion = "2.7.0"

dependencies {
    testImplementation(
            "com.codeborne:selenide:$selenideVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "net.datafaker:datafaker:$datafakerVersion")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

allure {
    version = allureVersion
    adapter {
        aspectjWeaver.set(true)
        allureJavaVersion.set(allureAdapterVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "full"
        }
    }
}